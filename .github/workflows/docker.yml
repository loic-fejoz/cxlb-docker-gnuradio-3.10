name: CI/CD Docker Build, Test & Publish

on:
  push:
    branches:
      - master
      - main
      - 'feat/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-test-publish:
    name: Build, Test and Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and load image into Docker for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: test-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          echo "=== Testing GNU Radio version ==="
          docker run --rm test-image:latest /bin/bash -lc "gnuradio-config-info --version"

          echo "=== Testing UHD version ==="
          docker run --rm test-image:latest /bin/bash -lc "uhd_find_devices --version"

          echo "=== Testing Volk version ==="
          docker run --rm test-image:latest /bin/bash -lc "volk-config-info --version"

          echo "=== Testing Python imports and NumPy compatibility ==="
          docker run --rm test-image:latest /bin/bash -lc "python3 -c '
          import gnuradio, uhd, bokehgui, numpy as np
          print(\"GNU Radio version:\", gnuradio.__version__)
          print(\"UHD version:\", uhd.__version__)
          print(\"NumPy version:\", np.__version__)
          assert int(np.__version__.split(\".\")[0]) < 2, \"NumPy version must be < 2\"
          '"

          echo "=== Testing SSH daemon configuration ==="
          docker run --rm test-image:latest /usr/sbin/sshd -t -p 2222

      - name: Publish Docker image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
